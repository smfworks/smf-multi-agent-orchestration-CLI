# Default forge.yaml template — smf-forge init
# Echo-only so `smf-forge run demo --prompt hi` works with no API keys.
project: ${FORGE_PROJECT:my-project}
version: "1.0.1"

agents:
  echo:
    type: echo

pipelines:
  demo:
    name: demo
    steps:
      - name: greet
        agent: echo
        prompt: "{{ prompt }}"
