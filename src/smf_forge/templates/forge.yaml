# Default forge.yaml template — smf-forge init
# Echo-only so `smf-forge run greet` works with no API keys.
project: ${FORGE_PROJECT:my-project}
version: "0.2.0"

agents:
  echo:
    type: echo

pipelines:
  greet:
    name: greet
    steps:
      - name: echo_input
        agent: echo
        prompt: "{{ prompt }}"

# Optional HTTP reviewer (uncomment and set OPENAI_API_KEY):
#   reviewer:
#     type: http
#     model: gpt-4
#     base_url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
#     api_key: ${OPENAI_API_KEY}
#     temperature: 0.3
