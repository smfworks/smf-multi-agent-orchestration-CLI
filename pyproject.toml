[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smf-forge"
version = "1.0.2"
description = "Lightweight multi-agent orchestration CLI — define, compose, and run AI agent pipelines from the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SMF Works", email = "dev@smfworks.com" }]
keywords = ["ai", "agents", "orchestration", "cli", "multi-agent", "pipeline", "yaml"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jinja2>=3.1",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
smf-forge = "smf_forge.cli:main"

[project.urls]
Homepage = "https://github.com/smfworks/smf-multi-agent-orchestration-CLI"
Repository = "https://github.com/smfworks/smf-multi-agent-orchestration-CLI"
Issues = "https://github.com/smfworks/smf-multi-agent-orchestration-CLI/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --import-mode=importlib"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["src/smf_forge"]