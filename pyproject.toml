[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smf-forge"
version = "0.2.0"
description = "Lightweight multi-agent orchestration CLI — define, compose, and run AI agent pipelines from the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SMF Works", email = "dev@smfworks.com" }]
keywords = ["ai", "agents", "orchestration", "cli", "multi-agent", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jinja2>=3.1",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
smf-forge = "smf_forge.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001",  # agent/engine surfaces must never raise to the CLI
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/smf_forge"]